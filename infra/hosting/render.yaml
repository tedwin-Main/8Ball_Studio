services:
  # Static Web Service for Frontend
  - type: web
    name: 8ball-studio-frontend
    env: static
    buildCommand: npm ci && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Web Service for API Backend
  - type: web
    name: 8ball-studio-backend
    env: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run start --workspace=@8ball/backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
